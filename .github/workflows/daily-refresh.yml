# Refresh the food price model every working day after PIHPS publishes (about 13:00 WIB = 06:00 UTC).
name: daily-refresh

on:
  schedule:
    - cron: "30 7 * * 1-5"   # 14:30 WIB, Monday to Friday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # keep downloaded quarters between runs so each run only re-requests the current quarter
      - uses: actions/cache@v4
        with:
          path: raw
          key: pihps-raw-${{ github.run_id }}
          restore-keys: pihps-raw-
      - name: Scrape (only the current quarter is re-downloaded; past quarters stay cached)
        run: python scrape_pihps.py
      - name: Build the SQL model and KPI tables
        run: python build_model.py
      - name: Publish aggregated outputs only
        run: python export_public.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          git diff --cached --quiet || git commit -m "Daily refresh $(date -u +%F)"
          git push
